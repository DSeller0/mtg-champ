<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MTG — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b08;--bg2:#13110d;--bg3:#1a1612;
  --border:#2e2820;--border2:#3d3428;
  --gold:#c9a84c;--gold2:#e8c96a;--gold-dim:#7a6230;
  --teal:#4ac8c0;--red:#c94c4c;--green:#4cad6e;
  --text:#e8dfc8;--text-dim:#8a7f68;--text-muted:#5a5244;
  --font-display:'Cinzel',serif;--font-body:'Crimson Text',serif;
  --radius:6px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Header ── */
.site-header{background:linear-gradient(180deg,#1c1710 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:20px 20px 14px;text-align:center}
.mana-row{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.site-title{font-family:var(--font-display);font-size:clamp(14px,2.8vw,24px);font-weight:900;color:var(--gold2);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 24px rgba(201,168,76,.28)}
.site-sub{font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-top:4px}

/* ── View switcher ── */
.view-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0;display:flex;overflow-x:auto;position:sticky;top:0;z-index:40}
.view-tab{font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;cursor:pointer;color:var(--text-muted);border:none;background:transparent;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;flex-shrink:0}
.view-tab:hover{color:var(--text-dim)}
.view-tab.active{color:var(--gold2);border-bottom-color:var(--gold2)}
.view-tab .count{font-size:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:1px 5px;margin-left:5px;color:var(--text-muted)}
.view-tab.active .count{border-color:var(--gold-dim);color:var(--gold-dim)}

/* ── Page ── */
.page{max-width:860px;margin:0 auto;padding:28px 20px 60px}
.view-panel{display:none}.view-panel.active{display:block}

/* ── Section title ── */
.section-title{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 16px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card-meta{font-size:11px;color:var(--text-muted);font-style:italic}

/* ── Champion banner ── */
.champion-banner{background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(232,201,106,.04));border:1px solid var(--gold-dim);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.champion-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.champion-crown{font-size:26px;margin-bottom:6px}
.champion-eyebrow{font-family:var(--font-display);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim)}
.champion-name{font-family:var(--font-display);font-size:clamp(18px,3vw,26px);font-weight:900;color:var(--gold2);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.champion-sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.champion-players{font-size:12px;color:var(--text-muted);margin-top:6px;font-style:italic}

/* ── Standings table ── */
.standings-table{width:100%;border-collapse:collapse}
.standings-table th{font-family:var(--font-display);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.standings-table th.right{text-align:right}
.standings-table td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.standings-table tr:last-child td{border-bottom:none}
.standings-table tr:hover td{background:rgba(255,255,255,.015)}
.rank-num{font-family:var(--font-display);font-size:13px;font-weight:700;text-align:center;width:32px}
.pts-val{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--gold)}
.wld{font-size:12px;color:var(--text-dim)}
.dupla-cell{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.players-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.deck-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:2px 5px;border-radius:3px;transition:color .15s}
.deck-btn:hover{color:var(--teal)}

/* ── TB table ── */
.tb-wrap{overflow-x:auto}
.tb-table{width:100%;border-collapse:collapse;font-size:12px}
.tb-table th{font-family:var(--font-display);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);padding:7px 8px;text-align:center;border-bottom:1px solid var(--border)}
.tb-table td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle}
.tb-table tr:last-child td{border-bottom:none}
.tb-w{color:var(--green);font-weight:700;background:rgba(76,173,110,.08);border-radius:3px;padding:2px 6px}
.tb-l{color:var(--red);background:rgba(201,76,76,.08);border-radius:3px;padding:2px 6px}
.tb-d{color:var(--teal);background:rgba(74,200,192,.08);border-radius:3px;padding:2px 6px}
.tb-na{color:var(--text-muted)}
.tb-legend{font-size:11px;color:var(--text-muted);padding:12px 16px;line-height:1.8;border-top:1px solid var(--border)}
.tb-legend b{color:var(--text-dim);font-style:normal}

/* ── History ── */
.hist-round{margin-bottom:20px}
.hist-round-label{font-family:var(--font-display);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.hist-match{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.hist-match:last-child{border-bottom:none}
.hist-badge{font-family:var(--font-display);font-size:8px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.hist-win{background:rgba(76,173,110,.12);border:1px solid var(--green);color:var(--green)}
.hist-draw{background:rgba(74,200,192,.1);border:1px solid var(--teal);color:var(--teal)}

/* ── General ranking ── */
.gen-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.gen-row:last-child{border-bottom:none}
.gen-row:hover{background:rgba(255,255,255,.015)}
.gen-rank{font-family:var(--font-display);font-size:13px;font-weight:700;width:32px;text-align:center;flex-shrink:0}
.gen-name{flex:1;font-family:var(--font-display);font-size:12px;letter-spacing:.04em;color:var(--text)}
.gen-pts{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--gold);flex-shrink:0}
.gen-detail{font-size:11px;color:var(--text-muted);flex-shrink:0;text-align:right;line-height:1.5}
.gen-trophies{display:flex;gap:4px;flex-shrink:0}
.trophy{font-size:12px}

/* ── Tournament selector ── */
.t-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.t-sel-btn{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.t-sel-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.t-sel-btn.active{background:var(--gold);color:#0d0b08;border-color:var(--gold)}

/* ── Deck tooltip ── */
.deck-tooltip{position:fixed;z-index:300;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:12px 14px;min-width:200px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.deck-tooltip.hidden{display:none}
.deck-tooltip-title{font-family:var(--font-display);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.deck-tooltip-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);gap:8px}
.deck-tooltip-row:last-child{border-bottom:none}
.deck-tooltip-player{font-size:12px;color:var(--text);flex:1}
.deck-tooltip-link{font-family:var(--font-display);font-size:9px;letter-spacing:.08em;color:var(--teal);text-decoration:none;border:1px solid var(--teal);border-radius:3px;padding:2px 7px;white-space:nowrap;transition:background .12s}
.deck-tooltip-link:hover{background:rgba(74,200,192,.1)}
.deck-tooltip-nolink{font-size:11px;color:var(--text-muted);font-style:italic}

/* ── Misc ── */
.empty-state{padding:36px 20px;text-align:center;color:var(--text-muted);font-style:italic;font-size:13px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;margin-bottom:20px;transition:color .15s;border:1px solid var(--border);border-radius:3px;padding:6px 12px}
.back-link:hover{color:var(--gold);border-color:var(--gold-dim)}
.badge{font-family:var(--font-display);font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.badge-done{background:rgba(76,173,110,.1);border:1px solid var(--green);color:var(--green)}
.badge-live{background:rgba(201,168,76,.14);border:1px solid var(--gold);color:var(--gold2)}
.badge-pending{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}

@media(max-width:580px){
  .page{padding:20px 14px 60px}
  .view-tab{padding:10px 12px;font-size:9px}
  .gen-detail{display:none}
  .standings-table th:nth-child(6),.standings-table td:nth-child(6){display:none}
}
</style>
</head>
<body>

<div id="root"><div style="text-align:center;padding:80px 20px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c9a84c">A Carregar...</div></div>

<!-- Deck tooltip -->
<div class="deck-tooltip hidden" id="deck-tooltip">
  <div class="deck-tooltip-title" id="tt-title"></div>
  <div id="tt-body"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════
function parseDate(str){
  if(!str) return null;
  const d=new Date(str+'T12:00:00');
  return isNaN(d)?null:d;
}
function fmtDate(str){
  const d=parseDate(str);
  if(!d) return '—';
  return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmt(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

// ── Points (mirrors tournament.html exactly) ──
function calcPoints(winsA,winsB,timeout){
  if(!timeout){
    if(winsA>winsB) return{ptsA:30,ptsB:winsB>0?10:0};
    if(winsB>winsA) return{ptsA:winsA>0?10:0,ptsB:30};
    return{ptsA:15,ptsB:15};
  }
  if(winsA===2&&winsB===1) return{ptsA:30,ptsB:10};
  if(winsB===2&&winsA===1) return{ptsA:10,ptsB:30};
  if(winsA===2&&winsB===0) return{ptsA:30,ptsB:0};
  if(winsB===2&&winsA===0) return{ptsA:0,ptsB:30};
  if(winsA===1&&winsB===0) return{ptsA:20,ptsB:0};
  if(winsB===1&&winsA===0) return{ptsA:0,ptsB:20};
  if(winsA===1&&winsB===1) return{ptsA:15,ptsB:15};
  return{ptsA:5,ptsB:5};
}

function buildH2H(t){
  const h2h={};
  (t.rounds||[]).filter(r=>r.status==='finished').forEach(r=>{
    (r.matches||[]).forEach(m=>{
      if(m.duplaB==='BYE'||m.winsA===null||m.winsA===undefined) return;
      const key=m.duplaA+'__'+m.duplaB;
      if(!h2h[key]) h2h[key]={a:0,b:0};
      if(m.winsA>m.winsB) h2h[key].a++;
      else if(m.winsB>m.winsA) h2h[key].b++;
    });
  });
  return h2h;
}

function getDuplaById(t,id){return(t.duplas||[]).find(d=>d.id===id);}

function getTournamentStandings(t){
  const map={};
  (t.duplas||[]).forEach(d=>{
    const deckCost=(d.players||[]).reduce((s,p)=>s+(p.deckPrice||0),0);
    map[d.id]={id:d.id,name:d.name,color:d.color,pts:0,wins:0,losses:0,draws:0,gameWins:0,gameLosses:0,deckCost,players:d.players||[]};
  });
  (t.rounds||[]).filter(r=>r.status==='finished').forEach(r=>{
    (r.matches||[]).forEach(m=>{
      if(m.duplaB==='BYE'||m.winsA===null||m.winsA===undefined) return;
      const{ptsA,ptsB}=calcPoints(m.winsA,m.winsB,m.timeout);
      if(map[m.duplaA]){
        map[m.duplaA].pts+=ptsA;
        map[m.duplaA].gameWins+=m.winsA;
        map[m.duplaA].gameLosses+=m.winsB;
        if(m.winsA>m.winsB) map[m.duplaA].wins++;
        else if(m.winsA<m.winsB) map[m.duplaA].losses++;
        else map[m.duplaA].draws++;
      }
      if(map[m.duplaB]){
        map[m.duplaB].pts+=ptsB;
        map[m.duplaB].gameWins+=m.winsB;
        map[m.duplaB].gameLosses+=m.winsA;
        if(m.winsB>m.winsA) map[m.duplaB].wins++;
        else if(m.winsB<m.winsA) map[m.duplaB].losses++;
        else map[m.duplaB].draws++;
      }
    });
  });

  const rows=Object.values(map);
  // TB1
  rows.forEach(r=>{r.tb1=r.pts-(r.gameLosses*10);});
  // TB2: força adversários
  rows.forEach(r=>{
    let s=0,c=0;
    (t.rounds||[]).filter(rr=>rr.status==='finished').forEach(rr=>{
      (rr.matches||[]).forEach(m=>{
        if(m.duplaB==='BYE'||m.winsA===null) return;
        if(m.duplaA===r.id&&map[m.duplaB]){s+=map[m.duplaB].pts;c++;}
        else if(m.duplaB===r.id&&map[m.duplaA]){s+=map[m.duplaA].pts;c++;}
      });
    });
    r.tb2=c?s:0;
  });
  // TB3: derrotas adversários
  rows.forEach(r=>{
    let s=0;
    (t.rounds||[]).filter(rr=>rr.status==='finished').forEach(rr=>{
      (rr.matches||[]).forEach(m=>{
        if(m.duplaB==='BYE'||m.winsA===null) return;
        if(m.duplaA===r.id&&map[m.duplaB]) s+=map[m.duplaB].losses;
        else if(m.duplaB===r.id&&map[m.duplaA]) s+=map[m.duplaA].losses;
      });
    });
    r.tb3=s;
  });

  const h2h=buildH2H(t);
  rows.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.tb1!==a.tb1) return b.tb1-a.tb1;
    if(b.tb2!==a.tb2) return b.tb2-a.tb2;
    if(a.tb3!==b.tb3) return a.tb3-b.tb3;
    // TB4 direct
    const k1=a.id+'__'+b.id,k2=b.id+'__'+a.id;
    const h=h2h[k1]||h2h[k2];
    if(h){
      const aW=h2h[k1]?h.a>h.b:h.b>h.a;
      const bW=h2h[k1]?h.b>h.a:h.a>h.b;
      if(aW&&!bW) return -1;
      if(bW&&!aW) return 1;
    }
    return a.deckCost-b.deckCost;
  });
  return rows;
}

function buildGeneralRanking(tournaments){
  const finished=tournaments.filter(t=>{
    const hasResults=(t.rounds||[]).some(r=>r.status==='finished'&&(r.matches||[]).some(m=>m.winsA!==null&&m.duplaB!=='BYE'));
    return t.status==='finished'&&hasResults;
  });
  if(!finished.length) return[];
  const byName={};
  finished.forEach(t=>{
    const standings=getTournamentStandings(t);
    standings.forEach((row,i)=>{
      const n=row.name;
      if(!byName[n]) byName[n]={name:n,totalPts:0,p1:0,p2:0,p3:0,events:0};
      byName[n].totalPts+=row.pts;
      byName[n].events++;
      if(i===0) byName[n].p1++;
      else if(i===1) byName[n].p2++;
      else if(i===2) byName[n].p3++;
    });
  });
  return Object.values(byName).sort((a,b)=>{
    if(b.totalPts!==a.totalPts) return b.totalPts-a.totalPts;
    if(b.p1!==a.p1) return b.p1-a.p1;
    if(b.p2!==a.p2) return b.p2-a.p2;
    if(b.p3!==a.p3) return b.p3-a.p3;
    return a.name.localeCompare(b.name,'pt-BR');
  });
}

// ══════════════════════════════════════════════════════
//  DECK TOOLTIP
// ══════════════════════════════════════════════════════
let tooltipOpen=false;
window._showTip=function(btn,json){
  const dupla=JSON.parse(decodeURIComponent(json));
  const tt=document.getElementById('deck-tooltip');
  document.getElementById('tt-title').textContent=dupla.name;
  document.getElementById('tt-body').innerHTML=(dupla.players||[]).map(p=>`
    <div class="deck-tooltip-row">
      <span class="deck-tooltip-player">${p.name||'Jogador'}</span>
      ${p.decklink
        ?`<a class="deck-tooltip-link" href="${p.decklink}" target="_blank" rel="noopener">🔗 Deck</a>`
        :`<span class="deck-tooltip-nolink">Sem link</span>`}
    </div>`).join('');
  tt.classList.remove('hidden');
  const rect=btn.getBoundingClientRect();
  const tw=tt.offsetWidth,th=tt.offsetHeight;
  let left=rect.left,top=rect.bottom+6;
  if(left+tw>window.innerWidth-8) left=window.innerWidth-tw-8;
  if(top+th>window.innerHeight-8) top=rect.top-th-6;
  tt.style.left=left+'px';tt.style.top=top+'px';
  tooltipOpen=true;
};
document.addEventListener('click',e=>{
  if(tooltipOpen&&!e.target.closest('#deck-tooltip')&&!e.target.closest('.deck-btn'))
  {document.getElementById('deck-tooltip').classList.add('hidden');tooltipOpen=false;}
});

// ══════════════════════════════════════════════════════
//  RENDER — TOURNAMENT VIEW
// ══════════════════════════════════════════════════════
function renderTournamentView(t){
  const rows=getTournamentStandings(t);
  const h2h=buildH2H(t);
  const hasResults=rows.some(r=>r.pts>0);
  const podiumColors=['#ffd700','#c0c0c0','#cd7f32'];
  const champion=hasResults?rows[0]:null;

  // ── History ──
  const finishedRounds=(t.rounds||[]).filter(r=>r.status==='finished');
  const histHTML=finishedRounds.length?`
  <div class="card">
    <div class="card-header">
      <div class="card-title">Histórico de Rodadas</div>
      <div class="card-meta">${finishedRounds.length} rodada${finishedRounds.length!==1?'s':''} encerrada${finishedRounds.length!==1?'s':''}</div>
    </div>
    <div style="padding:14px 16px">
      ${finishedRounds.map(r=>`
      <div class="hist-round">
        <div class="hist-round-label">Rodada ${r.roundNumber}</div>
        ${(r.matches||[]).filter(m=>m.duplaB!=='BYE'&&m.winsA!==null).map(m=>{
          const da=getDuplaById(t,m.duplaA),db=getDuplaById(t,m.duplaB);
          const{ptsA,ptsB}=calcPoints(m.winsA,m.winsB,m.timeout);
          const winner=m.winsA>m.winsB?da?.name:m.winsB>m.winsA?db?.name:null;
          return`<div class="hist-match">
            <div style="color:var(--text);font-size:13px">
              <span style="color:${da?.color||'var(--text-dim)'};font-weight:700">${da?.name||'?'}</span>
              <span style="color:var(--text-muted);margin:0 6px">${m.winsA}×${m.winsB}${m.timeout?'⏱':''}</span>
              <span style="color:${db?.color||'var(--text-dim)'};font-weight:700">${db?.name||'?'}</span>
            </div>
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:11px;color:var(--text-muted)">+${ptsA}/+${ptsB}</span>
              ${winner
                ?`<span class="hist-badge hist-win">${winner} venceu</span>`
                :`<span class="hist-badge hist-draw">Empate</span>`}
            </div>
          </div>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`:
  `<div class="card"><div class="empty-state">Nenhuma rodada encerrada neste torneio.</div></div>`;

  if(!hasResults) return`
    <a class="back-link" href="schedule.html">← Voltar à Agenda</a>
    <div class="card"><div class="empty-state">Resultados pendentes de publicação.</div></div>
    ${histHTML}`;

  // ── Main standings ──
  const standingsHTML=`
  <div class="card">
    <div class="card-header">
      <div class="card-title">Classificação Final</div>
      <div class="card-meta">${fmtDate(t.date)}</div>
    </div>
    <table class="standings-table">
      <thead><tr>
        <th>#</th><th>Dupla</th><th>Pts</th><th>V/E/D</th><th>Jogos</th><th>Decks</th>
      </tr></thead>
      <tbody>
        ${rows.map((r,i)=>{
          const enc=encodeURIComponent(JSON.stringify({name:r.name,players:r.players}));
          const hasLink=(r.players||[]).some(p=>p.decklink);
          return`<tr>
            <td><div class="rank-num" style="color:${i<3?podiumColors[i]:'var(--text-muted)'}">${i<3?['1º','2º','3º'][i]:(i+1)+'º'}</div></td>
            <td>
              <div class="dupla-cell">
                <div class="dot" style="background:${r.color||'#555'}"></div>
                <div>
                  <div style="font-family:var(--font-display);font-size:12px;color:var(--text)">${r.name}</div>
                  <div class="players-sub">${(r.players||[]).map(p=>p.name).filter(Boolean).join(' & ')||'—'}</div>
                </div>
              </div>
            </td>
            <td><span class="pts-val">${r.pts}</span></td>
            <td><span class="wld">${r.wins}/${r.draws}/${r.losses}</span></td>
            <td><span class="wld">${r.gameWins}–${r.gameLosses}</span></td>
            <td>${hasLink?`<button class="deck-btn" onclick="_showTip(this,'${enc}')" title="Ver decks">🔗</button>`:'<span style="color:var(--text-muted);font-size:11px">—</span>'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  // ── TB table ──
  const tbHTML=`
  <div class="card">
    <div class="card-header"><div class="card-title">Detalhamento dos Desempates</div></div>
    <div class="tb-wrap">
    <table class="tb-table">
      <thead>
        <tr>
          <th>#</th><th style="text-align:left">Dupla</th><th>Pts</th>
          <th>TB1<br><span style="font-size:7px;font-weight:400">Pts Brutos</span></th>
          <th>TB2<br><span style="font-size:7px;font-weight:400">Força Adv.</span></th>
          <th>TB3<br><span style="font-size:7px;font-weight:400">Derr. Adv.</span></th>
          <th colspan="${rows.length}" style="border-left:1px solid var(--border2)">TB4 — Confronto Direto ★</th>
          <th>TB5<br><span style="font-size:7px;font-weight:400">Deck R$</span></th>
        </tr>
        <tr>
          <th colspan="6"></th>
          ${rows.map(r=>`<th style="border-left:1px solid var(--border2);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px">${r.name.length>6?r.name.slice(0,6)+'…':r.name} ★</th>`).join('')}
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r,i)=>`<tr>
          <td style="color:${i<3?podiumColors[i]:'var(--text-muted)'};font-family:var(--font-display);font-size:10px">${i+1}º</td>
          <td style="text-align:left;white-space:nowrap">
            <span class="dot" style="background:${r.color||'#555'};display:inline-block;margin-right:5px"></span>
            <span style="color:var(--text);font-size:12px">${r.name}</span>
          </td>
          <td style="color:var(--gold);font-weight:700;font-family:var(--font-display)">${r.pts}</td>
          <td style="color:var(--text-dim)">${r.tb1}</td>
          <td style="color:var(--text-dim)">${r.tb2}</td>
          <td style="color:var(--text-dim)">${r.tb3}</td>
          ${rows.map((opp,oi)=>{
            if(oi===i) return '<td class="tb-na" style="border-left:1px solid var(--border2)">—</td>';
            const bL=oi===0?'border-left:1px solid var(--border2)':'';
            const k1=r.id+'__'+opp.id,k2=opp.id+'__'+r.id;
            const h=h2h[k1]||h2h[k2];
            if(!h) return '<td class="tb-na" style="'+bL+'">·</td>';
            const myW=h2h[k1]?h.a:h.b,oppW=h2h[k1]?h.b:h.a;
            if(myW>oppW) return '<td style="'+bL+'"><span class="tb-w">V</span></td>';
            if(oppW>myW) return '<td style="'+bL+'"><span class="tb-l">D</span></td>';
            return '<td style="'+bL+'"><span class="tb-d">E</span></td>';
          }).join('')}
          <td style="font-size:10px;color:var(--text-muted)">${r.deckCost?fmt(r.deckCost):'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div class="tb-legend">
      <b>TB1</b> — Pontos Brutos: Pts − (partidas individuais perdidas × 10).<br>
      <b>TB2</b> — Força dos Adversários: soma dos pontos dos seus oponentes.<br>
      <b>TB3</b> — Derrotas dos Adversários: soma das derrotas dos seus oponentes; menor = melhor.<br>
      <b>TB4</b> — Confronto Direto. ★ = coluna ativa.<br>
      <b>TB5</b> — Deck mais barato (R$).
    </div>
  </div>`;

  return`
    <a class="back-link" href="schedule.html">← Voltar à Agenda</a>
    ${champion?`<div class="champion-banner">
      <div class="champion-crown">👑</div>
      <div class="champion-eyebrow">Campeão — ${t.name}</div>
      <div class="champion-name">${champion.name}</div>
      <div class="champion-sub">${champion.pts} pontos · ${fmtDate(t.date)}</div>
      <div class="champion-players">${(champion.players||[]).map(p=>p.name).filter(Boolean).join(' & ')}</div>
    </div>`:''}
    ${standingsHTML}
    ${tbHTML}
    ${histHTML}`;
}

// ══════════════════════════════════════════════════════
//  RENDER — GENERAL RANKING VIEW
// ══════════════════════════════════════════════════════
function renderGeneralView(tournaments,ranking){
  const podiumColors=['#ffd700','#c0c0c0','#cd7f32'];
  const podiumClass=['rank-1','rank-2','rank-3'];
  const finished=tournaments.filter(t=>t.status==='finished'&&(t.rounds||[]).some(r=>r.status==='finished'));

  return`
    <a class="back-link" href="schedule.html">← Voltar à Agenda</a>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Ranking Geral</div>
        <div class="card-meta">${finished.length} torneio${finished.length!==1?'s':''} computado${finished.length!==1?'s':''}</div>
      </div>
      ${ranking.length?ranking.map((r,i)=>`
      <div class="gen-row">
        <div class="gen-rank ${i<3?podiumClass[i]:''}" style="${i<3?'color:'+podiumColors[i]:''}">${i+1}º</div>
        <div class="dot" style="background:${i<3?podiumColors[i]:'var(--text-muted)'}"></div>
        <div class="gen-name">${r.name}</div>
        <div class="gen-trophies">
          ${r.p1?`<span class="trophy" title="Vitórias">🥇×${r.p1}</span>`:''}
          ${r.p2?`<span class="trophy" title="Segundos lugares">🥈×${r.p2}</span>`:''}
          ${r.p3?`<span class="trophy" title="Terceiros lugares">🥉×${r.p3}</span>`:''}
        </div>
        <div class="gen-detail">${r.events} torneio${r.events!==1?'s':''}</div>
        <div class="gen-pts">${r.totalPts} <span style="font-size:10px;color:var(--text-muted);font-weight:400">pts</span></div>
      </div>`).join('')
      :`<div class="empty-state">Nenhum torneio encerrado com resultados ainda.</div>`}
    </div>

    ${finished.length?`
    <div class="section-title" style="margin-top:8px">Por Torneio</div>
    <div class="t-selector" id="t-selector">
      ${finished.map((t,i)=>`
        <button class="t-sel-btn${i===0?' active':''}" onclick="selectTournament('${t.id}',this)">
          ${t.name}
        </button>`).join('')}
    </div>
    <div id="per-tournament-panel">
      ${finished.length?renderTournamentView(finished[0]):''}
    </div>`:''}`;
}

// ══════════════════════════════════════════════════════
//  STATE & NAVIGATION
// ══════════════════════════════════════════════════════
let _tournaments=[];
let _currentView='general'; // 'general' | tournament id

function selectTournament(id,btn){
  document.querySelectorAll('.t-sel-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const t=_tournaments.find(t=>t.id===id);
  if(t) document.getElementById('per-tournament-panel').innerHTML=renderTournamentView(t);
}

function switchView(name){
  _currentView=name;
  document.querySelectorAll('.view-tab').forEach(b=>{
    b.classList.toggle('active',b.dataset.view===name);
  });
  document.querySelectorAll('.view-panel').forEach(p=>{
    p.classList.toggle('active',p.dataset.view===name);
  });
}

// ══════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════
function render(cfg, stateData){
  const gymName=cfg.gymName||'MTG Torneios';
  const accent=cfg.themeAccent||'#c9a84c';
  const fontFamily=cfg.fontFamily||"'Cinzel',serif";
  const googleFonts=cfg.googleFontsUrl||null;

  document.documentElement.style.setProperty('--gold',accent);
  if(fontFamily) document.body.style.fontFamily=fontFamily;
  if(googleFonts){const lk=document.getElementById('gfonts');if(lk)lk.href=googleFonts;}
  document.title=cfg.leaderboardTitle||cfg.appTitle||gymName+' — Leaderboard';

  _tournaments=stateData.tournaments||[];
  const ranking=buildGeneralRanking(_tournaments);

  // Check URL param for deep-link to specific tournament
  const params=new URLSearchParams(window.location.search);
  const paramT=params.get('tournament');
  const deepT=paramT?_tournaments.find(t=>t.id===paramT):null;

  // Finished tournaments with results
  const finishedWithResults=_tournaments.filter(t=>
    t.status==='finished'&&
    (t.rounds||[]).some(r=>r.status==='finished'&&(r.matches||[]).some(m=>m.winsA!==null&&m.duplaB!=='BYE'))
  );

  const headerHTML=`
  <div class="site-header">
    <div class="mana-row">
      <span class="ms ms-w ms-cost ms-shadow" style="font-size:20px" title="White"></span>
      <span class="ms ms-u ms-cost ms-shadow" style="font-size:20px" title="Blue"></span>
      <span class="ms ms-b ms-cost ms-shadow" style="font-size:20px" title="Black"></span>
      <span class="ms ms-r ms-cost ms-shadow" style="font-size:20px" title="Red"></span>
      <span class="ms ms-g ms-cost ms-shadow" style="font-size:20px" title="Green"></span>
    </div>
    <div class="site-title">${gymName}</div>
    <div class="site-sub">Leaderboard</div>
  </div>`;

  const viewBarHTML=`
  <div class="view-bar">
    <button class="view-tab active" data-view="general" onclick="switchView('general')">
      🏆 Ranking Geral<span class="count">${finishedWithResults.length}</span>
    </button>
    ${finishedWithResults.map(t=>`
      <button class="view-tab${deepT&&deepT.id===t.id?' active':''}" data-view="${t.id}" onclick="switchView('${t.id}')">
        ${t.name}<span class="count">${fmtDate(t.date).slice(0,5)}</span>
      </button>`).join('')}
  </div>`;

  // Build all panels
  const generalPanelHTML=`
  <div class="view-panel active" data-view="general">
    <div class="page">${renderGeneralView(_tournaments,ranking)}</div>
  </div>`;

  const tournamentPanelsHTML=finishedWithResults.map(t=>`
  <div class="view-panel${deepT&&deepT.id===t.id?' active':''}" data-view="${t.id}">
    <div class="page">
      <a class="back-link" href="schedule.html">← Voltar à Agenda</a>
      ${renderTournamentView(t)}
    </div>
  </div>`).join('');

  document.getElementById('root').innerHTML=
    headerHTML+viewBarHTML+generalPanelHTML+tournamentPanelsHTML;

  // If deep-linked to a specific tournament, activate its tab
  if(deepT){
    switchView(deepT.id);
  }
}

// ══════════════════════════════════════════════════════
//  LOAD
// ══════════════════════════════════════════════════════
Promise.all([
  fetch('./config.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch('./state.json?v='+Date.now()).then(r=>{
    if(!r.ok) throw new Error('state.json não encontrado (HTTP '+r.status+')');
    return r.json();
  })
]).then(([cfg,stateData])=>{
  render(cfg,stateData);
}).catch(err=>{
  document.getElementById('root').innerHTML=`
  <div class="site-header">
    <div class="mana-row">
      <span class="ms ms-w ms-cost ms-shadow" style="font-size:20px"></span>
      <span class="ms ms-u ms-cost ms-shadow" style="font-size:20px"></span>
      <span class="ms ms-b ms-cost ms-shadow" style="font-size:20px"></span>
      <span class="ms ms-r ms-cost ms-shadow" style="font-size:20px"></span>
      <span class="ms ms-g ms-cost ms-shadow" style="font-size:20px"></span>
    </div>
    <div class="site-title">MTG — Leaderboard</div>
    <div class="site-sub">Leaderboard</div>
  </div>
  <div class="page">
    <div style="text-align:center;padding:60px 20px;color:var(--red);font-size:13px;line-height:1.7">
      Não foi possível carregar os dados.<br>
      <small style="color:var(--text-muted)">Verifique se <b>state.json</b> está na mesma pasta.<br>${err.message}</small>
    </div>
  </div>`;
});
</script>
</body>
</html>
